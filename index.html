<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectra Snap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
    <style>
      /* bungee-spice-regular - latin */
      @font-face {
        font-display: swap;
        font-family: 'Bungee Spice';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/bungee-spice-v15-latin-regular.woff2') format('woff2');
      }

      body {
        /* Standard CSS comments use forward-slash and asterisk */
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #F9FAFB;
        overflow: hidden;
        touch-action: manipulation;
      }

      .font-bangers {
        font-family: 'Bangers', 'Impact', 'Arial Black', sans-serif; 
        font-weight: 400;
      }

      .font-bungee {
        font-family: 'Bungee Spice', 'Bangers', 'Impact', 'Arial Black', sans-serif !important;
        font-weight: 900;
        color: #4338ca; /* This is the "Indigo 700" fallback color */
        -webkit-text-fill-color: initial; /* Allows Bungee's colors to work if supported */
      }

      h1, h2, div {
        visibility: visible !important;
        opacity: 1 !important;
      }

      /* Custom Animations */
      @keyframes floatIn {
        0% { opacity: 0; transform: translateY(20px) scale(0.9); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes pop {
        0% { transform: scale(0.8); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .card-flip-container {
        perspective: 1000px;
      }
      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .card-inner.flipped {
        transform: rotateY(180deg);
      }
      .card-front, .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        border-radius: 1rem;
        /* Fix for bleeding through in some browsers */
        transform: translateZ(1px); 
      }
      .card-back {
        transform: rotateY(180deg) translateZ(1px);
      }
    </style>
  <script type="importmap">
{

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

  }
}
</script>

</head>

  </body>
</html>
